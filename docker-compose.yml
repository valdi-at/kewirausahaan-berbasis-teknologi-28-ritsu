services:
  postgres:
    image: postgres:17-alpine
    container_name: ritsu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ritsu
    ports:
      - "5432:5432"
    volumes:
      - ritsu_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ritsu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ritsu_pgdata:
